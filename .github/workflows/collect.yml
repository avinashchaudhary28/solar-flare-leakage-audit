name: Collect Phase 3 results from a run

# Manual: copies the phase3_* artifacts of an earlier run into results/phase3/ and commits them.
# Trigger: put the run id in phase3/collect_run_id.txt and push to audit-v2.
on:
  push:
    branches: [audit-v2]
    paths: ["phase3/collect_run_id.txt"]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rid
        run: echo "run_id=$(tr -dc 0-9 < phase3/collect_run_id.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: "phase3_*"
          path: dl
          run-id: ${{ steps.rid.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Commit results
        run: |
          set -e
          mkdir -p results/phase3
          for d in dl/phase3_*; do
            if [ -d "$d" ]; then n="${d#dl/phase3_}"; rm -rf "results/phase3/$n"; cp -r "$d" "results/phase3/$n"; fi
          done
          ls -R results/phase3 | head -50
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase3
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Phase 3 results (collected from run ${{ steps.rid.outputs.run_id }})"
          git push
